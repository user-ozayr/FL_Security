[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fl_security"
version = "0.2.0"
description = "Research simulation for MTD and additive-SMPC protected federated learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "flwr>=1.38,<1.39",
    "PyYAML>=6.0",
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "pandas>=1.4.0"
]

[project.optional-dependencies]
simulation = ["flwr[simulation]>=1.38,<1.39"]
dev = ["pytest>=7.0.0", "ruff>=0.4.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
