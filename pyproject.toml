[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fl_security"
version = "0.1.0"
description = "Securing Federated Learning through Moving Target Defense and Secure Multi-Party Computation"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "flwr>=1.5.0",
    "PyYAML>=6.0",
    "numpy>=1.22.0",
    "matplotlib>=3.5.0",
    "pandas>=1.4.0",
    "pytest>=7.0.0"
]
